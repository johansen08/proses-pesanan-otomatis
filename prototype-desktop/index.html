<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proses Pesanan Otomatis — Prototype</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --mut:#6b7488; --line:#e3e7ef;
  --side:#161d2e; --side2:#212b42; --acc:#2f6bff; --acc2:#e8efff;
  --ok:#16a34a; --okbg:#e7f7ed; --warn:#d97706; --warnbg:#fff3df; --bad:#dc2626; --badbg:#fde8e8;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0f1420;--card:#1a2133;--ink:#e8ecf5;--mut:#8f9ab3;--line:#2a3350;--acc2:#1f2f5c;--okbg:#12311f;--warnbg:#3a2a10;--badbg:#3d1818}
}
:root[data-theme=dark]{--bg:#0f1420;--card:#1a2133;--ink:#e8ecf5;--mut:#8f9ab3;--line:#2a3350;--acc2:#1f2f5c;--okbg:#12311f;--warnbg:#3a2a10;--badbg:#3d1818}
*{box-sizing:border-box;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
aside{width:208px;background:var(--side);color:#c5cde0;display:flex;flex-direction:column;padding:16px 10px;gap:4px;flex:none}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;padding:4px 10px 16px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-align:left;width:100%;position:relative}
.nav:hover{background:var(--side2)}
.nav.on{background:var(--acc);color:#fff}
.nav .dot{position:absolute;right:10px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:700}
.grow{flex:1}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:17px}
.clock{color:var(--mut);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{padding:6px 14px;border-radius:8px;font-weight:600;color:var(--mut);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.seg button.on.live{background:var(--warn);color:#fff}
.banner{background:var(--warnbg);color:var(--warn);padding:7px 24px;font-weight:600;display:none;align-items:center;gap:8px;flex:none}
body.live .banner{display:flex}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut)}
.iconbtn:hover{background:var(--bg)}
section.view{flex:1;overflow:auto;padding:24px;display:none}
section.view.on{display:block}

/* info icon + tooltip */
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--acc2);color:var(--acc);font-size:11px;font-weight:700;cursor:help;position:relative;flex:none;font-style:normal}
.i:hover::after,.i.open::after{content:attr(data-tip);position:absolute;z-index:50;left:50%;top:24px;transform:translateX(-50%);width:max-content;max-width:260px;background:#10172a;color:#fff;font-weight:400;font-size:12.5px;line-height:1.45;padding:9px 12px;border-radius:9px;box-shadow:0 8px 24px #0005;text-align:left;white-space:pre-line}
.i.l:hover::after,.i.l.open::after{left:0;transform:none}

/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-size:28px;line-height:1.1}
.stat span{color:var(--mut);display:flex;align-items:center;gap:6px}
.sec{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:15px;font-weight:700}
.sec:first-child{margin-top:0}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.acc{background:var(--acc2);color:var(--acc)}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;background:var(--acc);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.sec2{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.warn{background:var(--warn)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* tipe cards */
.tipe{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative}
.tipe:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px #2f6bff1f}
.tipe.rec{border:2px solid var(--acc)}
.tipe .top{display:flex;align-items:center;gap:8px}
.tipe h3{font-size:16px}
.tipe .jam{color:var(--mut);display:flex;align-items:center;gap:6px}
.badge-rec{position:absolute;top:-10px;right:14px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:7px;background:var(--bg);font-size:12px;color:var(--mut)}

/* runner */
.runner{display:grid;grid-template-columns:340px 1fr;gap:16px;height:calc(100vh - 150px);min-height:420px}
body.live .runner{height:calc(100vh - 186px)}
.steps{overflow:auto;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);color:var(--mut);flex:none}
.step.run{background:var(--acc2)}
.step.run .n{background:var(--acc);color:#fff;animation:pulse 1s infinite}
.step.done .n{background:var(--ok);color:#fff}
.step.err .n{background:var(--bad);color:#fff}
.step.skip .n{background:var(--line)}
.step .t{flex:1;font-weight:500}
.step.done .t{color:var(--mut)}
@keyframes pulse{50%{box-shadow:0 0 0 6px #2f6bff33}}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.log{flex:1;background:#0d1220;color:#b8c4e0;border-radius:10px;padding:12px 14px;font:12.5px/1.6 Consolas,monospace;overflow:auto}
.log .ok{color:#5ee08a}.log .w{color:#ffc15e}.log .e{color:#ff7a7a}.log .m{color:#6c7aa0}

/* cetak */
.jenis{display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid var(--line);transition:.12s}
.jenis:hover{border-color:var(--acc)}
.jenis.sel{border-color:var(--acc);background:var(--acc2)}
.jenis .ic{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--acc)}
.jenis .tx{flex:1}.jenis small{color:var(--mut);display:block}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:7px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dock{position:sticky;bottom:-24px;margin:20px -24px -24px;padding:14px 24px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
select,input[type=number]{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw i{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--acc)}.sw.on i::after{left:19px}

/* list */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .tx{flex:1}.row small{color:var(--mut);display:block}
.mono{font-family:Consolas,monospace}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600;font-size:12px}

/* modal + toast */
.ov{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:100}
.ov.on{display:grid}
.modal{background:var(--card);border-radius:18px;padding:26px;width:min(440px,92vw);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0008}
.modal h2{font-size:18px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;right:24px;bottom:24px;background:#10172a;color:#fff;padding:12px 18px;border-radius:12px;transform:translateY(90px);opacity:0;transition:.25s;z-index:200;display:flex;gap:10px;align-items:center}
#toast.on{transform:none;opacity:1}
@media(max-width:900px){aside{width:64px}.nav span,.logo span{display:none}.runner{grid-template-columns:1fr;height:auto}}
.presets{display:flex;gap:10px;flex-wrap:wrap}
.preset{padding:10px 16px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:2px;position:relative}
.preset small{color:var(--mut);font-weight:400}
.preset:hover{border-color:var(--acc)}.preset.on{border-color:var(--acc);background:var(--acc2)}
.preset .badge-rec{top:-9px;right:8px}
.grp{margin-bottom:14px}
.grp h4{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.grp h4 button{margin-left:auto;color:var(--acc);font-size:12px;text-transform:none;letter-spacing:0;font-weight:600}
.ck{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;user-select:none}
.ck:hover{border-color:var(--acc)}
.ck .b{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.ck .b svg{width:14px;stroke-width:3;opacity:0}
.ck.on{background:var(--acc2);border-color:var(--acc)}
.ck.on .b{background:var(--acc);border-color:var(--acc)}.ck.on .b svg{opacity:1}
.ck .no{margin-left:auto;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#v-harian .dock{margin-top:16px}
</style>
</head>
<body>
<svg style="display:none">
 <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
 <symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
 <symbol id="print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
 <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
 <symbol id="alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></symbol>
 <symbol id="hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.5M3 4v5h5M12 7v5l3 2"/></symbol>
 <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 00-2.2-1.3L14 3h-4l-.4 2.4a7 7 0 00-2.2 1.3l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.6l-2 1.6 2 3.4 2.4-1a7 7 0 002.2 1.3L10 21h4l.4-2.4a7 7 0 002.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9 0-1.3z"/></symbol>
 <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
 <symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
 <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-6 10a2 2 0 002 3h12a2 2 0 002-3l-6-10V3"/></symbol>
 <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
 <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></symbol>
 <symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
 <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
 <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></symbol>
</svg>

<aside>
  <div class="logo"><i><svg><use href="#box"/></svg></i><span>Pesanan Otomatis</span></div>
  <button class="nav on" data-v="harian"><svg><use href="#play"/></svg><span>Harian</span><b class="dot" id="dotP">4</b></button>
  <button class="nav" data-v="event"><svg><use href="#star"/></svg><span>Event</span></button>
  <button class="nav" data-v="cetak"><svg><use href="#print"/></svg><span>Cetak</span></button>
</aside>

<main>
  <header>
    <h1 id="judul">Harian</h1>
    <div class="grow"></div>
    <div class="clock"><svg><use href="#clock"/></svg><span id="jam">--:--</span></div>
    <button class="iconbtn" id="tema" title="Ganti tema"><svg><use href="#moon"/></svg></button>
  </header>
  <!-- HARIAN -->
  <section class="view on" id="v-harian">
    <div class="sec">Preset <span class="pill acc" id="sarJam"></span> <i class="i l" data-tip="Klik preset untuk mencentang langkah sesuai TIPE. Setelah itu centang/hapus centang manual bila perlu. Langkah selalu berjalan sesuai urutan daftar.">i</i></div>
    <div class="presets" id="presets"></div>
    <div class="sec">Langkah <span class="pill" id="hJum">0 dipilih</span> <span class="pill warn" id="hWarn" style="display:none">Gabung &amp; dipisah ikut tercentang <i class="i" style="margin-left:4px" data-tip="Biasanya hanya salah satu: GABUNG (TIPE 1/4) atau DIPISAH (TIPE 2/3).">i</i></span></div>
    <div id="checklist"></div>
    <div class="dock"><span id="dInfo" style="font-weight:600"></span><div class="grow"></div>
      <button class="btn sec2" id="dKosong">Kosongkan</button>
      <button class="btn" id="dJalan"><svg style="width:16px"><use href="#play"/></svg>Jalankan</button></div>

    <details class="card" id="pBox" style="margin-top:24px" open>
      <summary style="cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none">
        <svg style="color:var(--bad)"><use href="#alert"/></svg> Perlu perhatian <span class="pill bad" id="pJum">4</span>
        <i class="i" data-tip="Picklist terlompat, pesanan tanpa resi, dan proses yang gagal dari proses sebelumnya.">i</i></summary>
      <div class="sec" style="font-size:13px">Picklist terlompat <i class="i l" data-tip="Nomor picklist yang hilang dari urutan — biasanya batal/gagal dibuat karena Jubelio error.">i</i></div>
      <div id="pTerlompat"></div>
      <div class="sec" style="font-size:13px">Pesanan tanpa resi <i class="i l" data-tip="Sudah Picking > Selesai tapi tidak dapat nomor resi. Biasanya ada request cancel — infokan ke tim admin/CS.">i</i></div>
      <div id="pResi"></div>
      <div class="sec" style="font-size:13px">Proses gagal <i class="i l" data-tip="Langkah yang terhenti, mis. timeout unduh label PDF.">i</i></div>
      <div id="pMasalah"></div>
    </details>
  </section>

  <!-- PROSES: jalan -->
  <section class="view" id="v-runner">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <button class="iconbtn" id="kembali" title="Kembali"><svg><use href="#back"/></svg></button>
      <h2 id="rTitle" style="font-size:18px"></h2>
      <div class="grow"></div>
      <span id="rPct" style="font-weight:700;font-variant-numeric:tabular-nums"></span>
      <button class="btn" id="rMulai"><svg style="width:16px"><use href="#play"/></svg>Mulai</button>
      <button class="btn bad" id="rStop" style="display:none"><svg style="width:16px"><use href="#stop"/></svg>Hentikan</button>
    </div>
    <div class="bar" style="margin-bottom:14px"><i id="rBar"></i></div>
    <div class="runner">
      <div class="card steps" id="rSteps"></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px;min-height:0">
        <div style="display:flex;align-items:center;gap:8px;font-weight:700">Aktivitas <i class="i" data-tip="Catatan langsung dari program. Merah = perlu perhatian.">i</i></div>
        <div class="log" id="rLog"></div>
      </div>
    </div>
  </section>

  <!-- CETAK -->
  <section class="view" id="v-cetak">
    <div class="tabs" id="cTabs"></div>
    <div class="grid g3" id="cGrid"></div>
    <div class="dock">
      <span id="cInfo" style="font-weight:600">Pilih jenis label</span>
      <div class="grow"></div>
      <label class="sw" id="cSemua"><i></i>Semua sesi <i class="i" data-tip="Cetak semua sesi N hari terakhir, terlama → terbaru. Label yang sudah pernah tercetak dilewati otomatis.">i</i></label>
      <span id="cHariBox" style="display:none;align-items:center;gap:6px"><input type="number" id="cHari" value="1" min="1" max="7" style="width:64px"> hari</span>
      <select id="cPrinter"><option>Printer Thermal 100x150 (Ruang Resi)</option><option>Printer Thermal 2 (Lantai 2)</option><option>Simpan sebagai PDF</option></select>
      <button class="btn" id="cCetak" disabled><svg style="width:16px"><use href="#print"/></svg>Cetak</button>
    </div>
  </section>

  <!-- EVENT -->
  <section class="view" id="v-event">
    <div class="card" style="display:flex;gap:14px;align-items:center;margin-bottom:20px;background:var(--acc2);border-color:var(--acc)">
      <svg style="width:28px;height:28px;color:var(--acc)"><use href="#star"/></svg>
      <div class="tx" style="flex:1"><b>Hari event 10.10 / 11.11 / 12.12</b><div style="color:var(--mut)">J&T, SPX Hemat, SPX Standard dipisah seharian</div></div>
      <i class="i" data-tip="Penentuan SKU spesial dihitung PER KURIR. SPX Standard tidak punya jalur spesial dan dipecah per lantai.">i</i>
    </div>
    <div class="grid g3" id="daftarEvent"></div>
  </section>

  </main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ic=n=>`<svg><use href="#${n}"/></svg>`;


/* ---------- data ---------- */
const AWAL=['Recheck stok','Sampel TikTok (nilai 0)','Urgent Lazada','Urgent GTL & SiCepat'];
const AKHIR=['Tulis PICKLIST.xlsx','Upload faktur & pesanan ke IRESIS'];
const TIPE=[
 {id:1,nama:'TIPE 1',sub:'Gabung J&T + SPX',jam:'07.00–12.00 · 16.00–17.00',tip:'Dipakai pagi (07.00–12.00) dan sore (16.00–17.00). J&T dan SPX digabung dalam satu picklist.',
  mid:['SPX-J&T Spesial','SPX-J&T 1 qty reguler','SPX-J&T Kombinasi']},
 {id:2,nama:'TIPE 2',sub:'Dipisah + SPX Resi Pagi',jam:'Tepat 13.00',tip:'Menghabiskan wajib keluar Shopee (pesan ≤ 12.00). Cukup 1× sehari — jangan diulang di TIPE 3.',
  mid:['SPX ≤ 12.00 (Resi Pagi)','J&T Spesial','J&T 1 qty reguler','J&T Kombinasi','SPX Spesial','SPX 1 qty reguler','SPX Kombinasi']},
 {id:3,nama:'TIPE 3',sub:'Dipisah',jam:'13.00–15.00',tip:'J&T dan SPX diproses terpisah.',
  mid:['J&T Spesial','J&T 1 qty reguler','J&T Kombinasi','SPX Spesial','SPX 1 qty reguler','SPX Kombinasi']},
 {id:4,nama:'TIPE 4',sub:'Gabung + J&T Resi Siang',jam:'Tepat 15.00',tip:'Menghabiskan wajib keluar TikTok Shop (J&T pesan ≤ 15.00).',
  mid:['J&T ≤ 15.00 (Resi Siang)','SPX-J&T Spesial','SPX-J&T 1 qty reguler','SPX-J&T Kombinasi']},
 {id:5,nama:'MALAM',sub:'Urgent + SPX-J&T',jam:'Malam hari',tip:'Proses-malam.bat: Urgent Lazada, Urgent GTL-SiCepat, lalu SPX-J&T.',
  custom:['Urgent Lazada','Urgent GTL & SiCepat','SPX-J&T']},
];
tipeSteps=t=>t.custom?t.custom:[...AWAL,...t.mid,...AKHIR];

const EVENT=[
 {id:'e1',nama:'J&T',sub:'Spesial · 1 qty · Kombinasi',tip:'Penentuan SKU spesial khusus J&T.',steps:[...AWAL,'J&T Spesial','J&T 1 qty reguler','J&T Kombinasi',...AKHIR]},
 {id:'e2',nama:'SPX Hemat',sub:'Spesial · 1 qty · Kombinasi',tip:'Penentuan SKU spesial khusus SPX Hemat.',steps:[...AWAL,'SPX Hemat Spesial','SPX Hemat 1 qty','SPX Hemat Kombinasi',...AKHIR]},
 {id:'e3',nama:'SPX Standard',sub:'Dipecah per lantai',tip:'Tidak ada jalur spesial — langsung dipecah per lantai.',steps:[...AWAL,'SPX Standard Lantai 1','SPX Standard Lantai 2','SPX Standard Lantai 3',...AKHIR]},
];

const CETAK={
 'Harian':[['Spesial','Label SKU spesial','star'],['GTL-SiCepat','Urgent GTL & SiCepat','bolt'],['Satuan','1 SKU 1 qty reguler','box'],['Kombinasi','Beberapa SKU dalam 1 pesanan','box'],['Paket harian','4 jenis berurutan, printer dipilih sekali','print']],
 'Event':[['Spesial event','SKU spesial per kurir','star'],['SPX Standard','Per lantai','box'],['Paket event','Semua jenis event','print']],
 'Per kurir':[['J&T semua','Semua label J&T','box'],['SPX semua','Semua label SPX','box'],['SPX Hemat','Semua label SPX Hemat','box']],
};

const JADWAL=[[7,12,1],[12,13,0],[13,15,3],[15,16,4]];
function tipeSekarang(){const h=new Date().getHours()+new Date().getMinutes()/60;
  if(h>=7&&h<12)return 1; if(h>=12.9&&h<13.5)return 2; if(h>=13.5&&h<15)return 3; if(h>=15&&h<16)return 4; if(h>=16&&h<17)return 1; return h>=17||h<7?5:0;}

/* ---------- navigasi ---------- */
const JUDUL={harian:'Harian',runner:'Proses berjalan',cetak:'Cetak Label',event:'Event'};
let asal='harian';
function go(v){
  $$('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  $$('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===(v==='runner'?asal:v)));
  $('#judul').textContent=JUDUL[v];
}
$$('.nav').forEach(n=>n.onclick=()=>{if(running&&n.dataset.v===asal)return go('runner');go(n.dataset.v)});

/* ---------- tema ---------- */
$('#tema').onclick=()=>{const r=document.documentElement;const d=getComputedStyle(document.body).backgroundColor==='rgb(15, 20, 32)';
  r.dataset.theme=d?'light':'dark';$('#tema').innerHTML=ic(d?'moon':'sun');};

/* ---------- info icon klik ---------- */
document.addEventListener('click',e=>{const i=e.target.closest('.i');$$('.i.open').forEach(x=>x!==i&&x.classList.remove('open'));if(i)i.classList.toggle('open')});

/* ---------- jam ---------- */
function tick(){const d=new Date();$('#jam').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).replace(/\./g,':');}
setInterval(tick,1000);tick();

/* ---------- kartu TIPE ---------- */
function kartuTipe(t,rec){
 const n=tipeSteps(t).length;
 return `<div class="card tipe ${rec?'rec':''}" data-id="${t.id}">${rec?'<span class="badge-rec">Disarankan</span>':''}
  <div class="top"><h3>${t.nama}</h3><span style="color:var(--mut)">${t.sub}</span><div class="grow"></div><i class="i" data-tip="${t.tip}">i</i></div>
  <div class="jam">${ic('clock')}${t.jam}</div>
  <div class="chips"><span class="chip">${n} langkah</span>${t.custom?'':'<span class="chip">Recheck</span><span class="chip">Urgent</span><span class="chip">IRESIS</span>'}</div>
  <div style="display:flex;justify-content:flex-end"><span class="btn" style="padding:8px 14px">${ic('play')}Buka</span></div></div>`;}
function bind(el,list){el.querySelectorAll('.tipe').forEach(c=>c.onclick=e=>{if(e.target.closest('.i'))return;
  bukaRunner(list.find(t=>String(t.id)===c.dataset.id))});}
function render(){
 const rec=tipeSekarang();
 $('#sarJam').textContent='sekarang '+new Date().toTimeString().slice(0,5);
  initHarian(rec);
 $('#daftarEvent').innerHTML=EVENT.map(t=>kartuTipe({...t,jam:'Seharian',custom:t.steps},false)).join('');bind($('#daftarEvent'),EVENT);
}

/* ---------- harian: checklist ---------- */
const GRUP=[
 ['Persiapan',['Recheck stok','Sampel TikTok (nilai 0)']],
 ['Urgent',['Urgent Lazada','Urgent GTL & SiCepat']],
 ['Batas waktu',['SPX ≤ 12.00 (Resi Pagi)','J&T ≤ 15.00 (Resi Siang)']],
 ['Gabung J&T + SPX',['SPX-J&T Spesial','SPX-J&T 1 qty reguler','SPX-J&T Kombinasi']],
 ['Dipisah — J&T',['J&T Spesial','J&T 1 qty reguler','J&T Kombinasi']],
 ['Dipisah — SPX',['SPX Spesial','SPX 1 qty reguler','SPX Kombinasi']],
 ['Penutup',['Tulis PICKLIST.xlsx','Upload faktur & pesanan ke IRESIS']],
];
const SEMUA=GRUP.flatMap(g=>g[1]);
const PRESET=[...TIPE.slice(0,4).map(t=>({id:t.id,nama:t.nama,sub:t.jam,steps:tipeSteps(t)})),
 {id:5,nama:'MALAM',sub:'Urgent + SPX-J&T',steps:['Urgent Lazada','Urgent GTL & SiCepat','SPX-J&T Spesial','SPX-J&T 1 qty reguler','SPX-J&T Kombinasi']}];
let pilih=new Set(),presetAktif=null;
function setPreset(p){presetAktif=p?p.id:null;pilih=new Set(p?p.steps:[]);drawHarian();}
function initHarian(rec){window._rec=rec;const p=PRESET.find(x=>x.id===rec);if(!presetAktif&&!pilih.size&&p){presetAktif=p.id;pilih=new Set(p.steps);}drawHarian();}
function drawHarian(){
 $('#presets').innerHTML=PRESET.map(p=>`<button class="preset ${p.id===presetAktif?'on':''}" data-id="${p.id}">${p.id===window._rec?'<span class="badge-rec">Sekarang</span>':''}${p.nama}<small>${p.sub}</small></button>`).join('');
 $$('#presets .preset').forEach(b=>b.onclick=()=>setPreset(PRESET.find(p=>p.id==b.dataset.id)));
 let n=0;
 $('#checklist').innerHTML=GRUP.map(([g,ls])=>`<div class="grp"><h4>${g}<button data-g="${g}">${ls.every(x=>pilih.has(x))?'Hapus semua':'Pilih semua'}</button></h4>`+ls.map(x=>{const on=pilih.has(x);return `<div class="ck ${on?'on':''}" data-s="${x}"><span class="b">${ic('check')}</span>${x}${on?`<span class="no">#${++n}</span>`:''}</div>`}).join('')+'</div>').join('');
 $$('#checklist .ck').forEach(c=>c.onclick=()=>{const x=c.dataset.s;pilih.has(x)?pilih.delete(x):pilih.add(x);presetAktif=null;drawHarian();});
 $$('#checklist h4 button').forEach(b=>b.onclick=()=>{const ls=GRUP.find(g=>g[0]===b.dataset.g)[1];const all=ls.every(x=>pilih.has(x));ls.forEach(x=>all?pilih.delete(x):pilih.add(x));presetAktif=null;drawHarian();});
 const c=pilih.size;$('#hJum').textContent=c+' dipilih';$('#hJum').className='pill '+(c?'acc':'');
 const gab=['SPX-J&T Spesial','SPX-J&T 1 qty reguler','SPX-J&T Kombinasi'].some(x=>pilih.has(x)),dis=['J&T Spesial','J&T 1 qty reguler','J&T Kombinasi','SPX Spesial','SPX 1 qty reguler','SPX Kombinasi'].some(x=>pilih.has(x));
 $('#hWarn').style.display=gab&&dis?'':'none';
 $('#dInfo').textContent=c?(presetAktif?PRESET.find(p=>p.id===presetAktif).nama+' · ':'Kustom · ')+c+' langkah':'Belum ada langkah dipilih';
 $('#dJalan').disabled=!c;$('#dKosong').disabled=!c;
}
$('#dKosong').onclick=()=>setPreset(null);
$('#dJalan').onclick=()=>{if(running){toast('Masih ada proses berjalan');return go('runner');}
 const list=SEMUA.filter(x=>pilih.has(x));const nm=presetAktif?PRESET.find(p=>p.id===presetAktif).nama:'Kustom';
 konfirmasi(`<h2>Jalankan ${nm}?</h2><p>${list.length} langkah berurutan. Picklist, resi, dan label akan dibuat di Jubelio.</p><div class="chips">${list.map((x,i)=>`<span class="chip">${i+1}. ${x}</span>`).join('')}</div>
 <div class="acts"><button class="btn sec2" onclick="tutup()">Batal</button><button class="btn" id="yaJalan">Ya, jalankan</button></div>`);
 $('#yaJalan').onclick=()=>{tutup();bukaRunner({id:'h',nama:nm,steps:null,custom:list},'harian');jalan();};};

/* ---------- runner ---------- */
let cur,running=false,timer,idx=0,stat=[];
function bukaRunner(t,dari){
 if(running){toast('Masih ada proses berjalan');return go('runner');}
 cur={...t,list:t.custom||t.steps||tipeSteps(t)};idx=0;stat=cur.list.map(()=>'');
 $('#rTitle').textContent=t.nama+(t.sub?' — '+t.sub:'');
 $('#rLog').innerHTML='<div class="m">Siap. Tekan Mulai untuk menjalankan '+cur.list.length+' langkah berurutan.</div>';
 $('#rBar').style.width='0';$('#rPct').textContent='0%';
 drawSteps();$('#rMulai').style.display='';$('#rStop').style.display='none';
 asal=dari||(t.steps?'event':'harian');
 go('runner');
}
function drawSteps(){
 $('#rSteps').innerHTML=cur.list.map((s,i)=>`<div class="step ${stat[i]}"><span class="n">${stat[i]==='done'?ic('check').replace('<svg','<svg style="width:15px;stroke-width:3"'):stat[i]==='err'?ic('x').replace('<svg','<svg style="width:15px;stroke-width:3"'):i+1}</span><span class="t">${s}</span>${stat[i]==='skip'?'<span class="pill">dilewati</span>':''}</div>`).join('');
 const r=$('#rSteps .run');r&&r.scrollIntoView({block:'nearest'});
}
function log(t,c=''){const l=$('#rLog');l.insertAdjacentHTML('beforeend',`<div class="${c}">${new Date().toTimeString().slice(0,8)}  ${t}</div>`);l.scrollTop=l.scrollHeight;}
$('#kembali').onclick=()=>go(asal);
$('#rMulai').onclick=()=>{
 konfirmasi(`<h2>Jalankan ${cur.nama}?</h2><p>${cur.list.length} langkah berurutan. Picklist, resi, dan label akan dibuat di Jubelio.</p>
  <div class="acts"><button class="btn sec2" onclick="tutup()">Batal</button><button class="btn" onclick="tutup();jalan()">Ya, jalankan</button></div>`);
};
$('#rStop').onclick=()=>{clearTimeout(timer);running=false;stat[idx]='err';log('Dihentikan oleh pengguna','w');drawSteps();selesaiUI(true);};
function jalan(){running=true;idx=0;stat=cur.list.map(()=>'');
 $('#rMulai').style.display='none';$('#rStop').style.display='';
 $('#rLog').innerHTML='';log(`Mulai ${cur.nama}`,'m');langkah();}
function langkah(){
 if(idx>=cur.list.length){running=false;log('Selesai. Semua langkah berhasil.','ok');selesaiUI(false);return;}
 const nama=cur.list[idx];stat[idx]='run';drawSteps();log('▶ '+nama);
 const pct=Math.round(idx/cur.list.length*100);$('#rBar').style.width=pct+'%';$('#rPct').textContent=pct+'%';
 timer=setTimeout(()=>{
  const pk=Math.floor(Math.random()*40)+3;
  if(/Upload/.test(nama)&&new Date().getHours()>=20){stat[idx]='skip';log('IRESIS dilewati (jam 20.00–04.59)','w');}
  else if(/Recheck/.test(nama)){stat[idx]='done';log(`  ${pk} pesanan stok kembali tersedia`,'ok');}
  else if(/Tulis/.test(nama)){stat[idx]='done';log('  antrean 6 picklist ditulis ke PICKLIST.xlsx','ok');}
  else if(/Upload/.test(nama)){stat[idx]='done';log('  faktur & pesanan terunggah','ok');}
  else {stat[idx]='done';log(Math.random()<.15?'  tidak ada pesanan — dilewati':`  PICK-000${Math.floor(Math.random()*9000+1000)} · ${pk} pesanan · label tersimpan`,'ok');}
  idx++;langkah();},700+Math.random()*700);
}
function selesaiUI(gagal){$('#rMulai').style.display='';$('#rMulai').innerHTML=ic('play').replace('<svg','<svg style="width:16px"')+'Ulangi';$('#rStop').style.display='none';
 if(!gagal){$('#rBar').style.width='100%';$('#rPct').textContent='100%';toast('Proses selesai ✓');}}

/* ---------- modal & toast ---------- */
function konfirmasi(h){$('#modal').innerHTML=h;$('#ov').classList.add('on');}
function tutup(){$('#ov').classList.remove('on');}
$('#ov').onclick=e=>{if(e.target.id==='ov')tutup()};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);}

/* ---------- cetak ---------- */
let cTab='Harian',cSel=null,cSemua=false;
function drawCetak(){
 $('#cTabs').innerHTML=Object.keys(CETAK).map(k=>`<button class="${k===cTab?'on':''}" data-k="${k}">${k}</button>`).join('');
 $$('#cTabs button').forEach(b=>b.onclick=()=>{cTab=b.dataset.k;cSel=null;drawCetak();});
 $('#cGrid').innerHTML=CETAK[cTab].map((j,i)=>`<div class="card jenis ${cSel===i?'sel':''}" data-i="${i}"><span class="ic">${ic(j[2])}</span><span class="tx"><b>${j[0]}</b><small>${j[1]}</small></span>${cSel===i?'<span class="pill ok">'+Math.floor(20+i*13)+' label</span>':''}</div>`).join('');
 $$('#cGrid .jenis').forEach(c=>c.onclick=()=>{cSel=+c.dataset.i;drawCetak();});
 $('#cInfo').textContent=cSel===null?'Pilih jenis label':CETAK[cTab][cSel][0]+(cSemua?' · semua sesi':' · sesi terbaru');
 $('#cCetak').disabled=cSel===null;
}
$('#cSemua').onclick=e=>{if(e.target.closest('.i'))return;cSemua=!cSemua;$('#cSemua').classList.toggle('on',cSemua);$('#cHariBox').style.display=cSemua?'flex':'none';drawCetak();};
$('#cCetak').onclick=()=>{
 const j=CETAK[cTab][cSel][0];
 konfirmasi(`<h2>Cetak ${j}?</h2><p>Printer: <b>${$('#cPrinter').value}</b><br>${cSemua?'Semua sesi '+$('#cHari').value+' hari terakhir, yang sudah tercetak dilewati.':'Hanya sesi terbaru.'}</p>
 <div class="acts"><button class="btn sec2" onclick="tutup()">Batal</button><button class="btn" onclick="tutup();toast('Mengirim ${j} ke printer…');setTimeout(()=>toast('${j}: selesai dicetak ✓'),1800)">${ic('print').replace('<svg','<svg style="width:16px"')}Cetak</button></div>`);};

let jumP=4;function kurangiP(){jumP--;$('#pJum').textContent=jumP;$('#dotP').style.display=jumP>0?'':'none';$('#dotP').textContent=jumP;}
/* ---------- peringatan ---------- */
function drawPeringatan(){
 $('#pTerlompat').innerHTML=[['PICK-000104821','Terlompat setelah 000104820 · 07.42'],['PICK-000104833','Terlompat setelah 000104832 · 11.15']].map(r=>`<div class="row"><span class="mono" style="font-weight:700">${r[0]}</span><span class="tx"><small>${r[1]}</small></span><button class="btn sec2" onclick="this.closest('.row').remove();kurangiP();toast('Ditandai sudah dicek')">Sudah dicek</button></div>`).join('');
 $('#pResi').innerHTML=`<div class="row"><span class="mono" style="font-weight:700">SPX-2610-88231</span><span class="tx"><small>Shopee · belum dapat resi 40 menit · kemungkinan cancel</small></span><button class="btn sec2" onclick="navigator.clipboard&&navigator.clipboard.writeText('SPX-2610-88231');toast('Nomor disalin')">Salin nomor</button></div>`;
 $('#pMasalah').innerHTML=`<div class="row"><span class="pill bad">Gagal</span><span class="tx"><b>J&T Kombinasi</b><small>Timeout unduh label PDF · 10.18</small></span><button class="btn sec2" onclick="toast('Dilanjutkan dari PICK-000104830')">Lanjutkan</button></div>`;
}

render();drawCetak();drawPeringatan();
</script>
</body>
</html>
