<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proses Pesanan Otomatis</title>
<style>
:root{
  --bg:#f6f7f9; --surf:#fff; --ink:#151a24; --mut:#667085; --faint:#98a2b3; --line:#e6e8ec;
  --acc:#3b5bdb; --acc-h:#324ec2; --accbg:#eef2ff;
  --ok:#17803d; --okbg:#e8f5ec; --warn:#b45309; --warnbg:#fef3e2; --bad:#c62828; --badbg:#fdecec;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.05);
}
:root[data-theme=dark]{--bg:#0e1116;--surf:#161b22;--ink:#e7eaf0;--mut:#9aa4b5;--faint:#6b7587;--line:#262d38;--accbg:#1b2547;--acc:#6b86ff;--acc-h:#8398ff;--okbg:#10291a;--ok:#4cc77a;--warnbg:#33260e;--warn:#f0a34a;--badbg:#341616;--bad:#f27474}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.mono{font-family:Consolas,monospace}

/* rail */
.rail{width:84px;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;flex:none}
.brand{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;margin-bottom:18px}
.tab{width:64px;padding:10px 0 8px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--mut);position:relative}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab.on{background:var(--accbg);color:var(--acc)}
.tab .bd{position:absolute;top:2px;right:2px;box-sizing:border-box;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surf);font-style:normal}

/* page */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 28px 0;flex:none}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.top p{color:var(--mut);margin-top:2px}
.meta{display:flex;align-items:center;gap:12px;color:var(--mut)}
.meta select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink);font:inherit;font-weight:600}
.meta select:disabled{opacity:.6}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--mut);display:grid;place-items:center}
.ib:hover{color:var(--ink);background:var(--bg)}
.view{display:none;flex:1;min-height:0;padding:14px 28px 16px}
.view.on{display:grid}
.two{grid-template-columns:minmax(0,1fr) 350px;gap:24px}
.col{overflow:auto;padding:2px 8px 24px 2px;min-height:0}
.side{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding:2px 2px 24px}

/* jadwal (pilih paket) */
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lbl .sp+button,.lbl button{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--acc);font-weight:600}
.lbl .n{background:var(--accbg);color:var(--acc);border-radius:99px;padding:0 8px;font-size:12px;letter-spacing:0}
.sched{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:16px}
.pk{background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);padding:8px 12px;text-align:left;display:flex;flex-direction:column;gap:0;box-shadow:var(--sh);transition:.12s;position:relative;min-width:0}
.pk:hover{border-color:var(--faint)}
.pk.on{border-color:var(--acc);background:var(--accbg)}
.pk b{font-size:14.5px}
.pk .j{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowdot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pk .s{margin-top:8px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;color:var(--faint)}
.pk .s::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.pk .s.now{color:var(--acc)}.pk .s.now::before{background:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.pk.on .s.now::before{box-shadow:0 0 0 3px var(--surf)}
.pk .s.done{color:var(--ok)}.pk .s.done::before{background:var(--ok)}

/* pipeline langkah */
.pipe{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:4px 0;margin-bottom:10px}
.ps{display:flex;align-items:center;gap:12px;padding:5px 14px;position:relative}
.ps:hover{background:var(--bg)}
.ps .no{width:22px;height:22px;border-radius:50%;background:var(--accbg);color:var(--acc);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.ps:not(:last-child)::after{content:"";position:absolute;left:24px;top:27px;bottom:-5px;width:2px;background:var(--line)}
.ps .nm{flex:1}
.ps .gp{font-size:12px;color:var(--faint)}
.ps .rm{width:24px;height:24px;border-radius:7px;color:var(--faint);display:grid;place-items:center;opacity:0}
.ps:hover .rm,.ps .rm:focus-visible{opacity:1}
.ps .rm:hover{background:var(--badbg);color:var(--bad)}
.ps.konf .no{background:var(--warnbg);color:var(--warn)}
.tg{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warnbg);color:var(--warn)}
.lbl.tgl{cursor:pointer;user-select:none;margin-bottom:10px}
.lbl.tgl .chev{width:15px;height:15px;color:var(--faint);transition:.15s}.lbl.tgl.open .chev{transform:rotate(90deg)}
.lbl.tgl .hid{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--acc);font-weight:600}
.lbl.tgl:hover .hid{text-decoration:underline}
.urut[hidden]{display:none}
.kosong{padding:28px;text-align:center;color:var(--faint)}
.add{background:transparent;border:1.5px dashed var(--line);border-radius:var(--r);padding:9px 14px}
.add summary{cursor:pointer;color:var(--acc);font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.add summary::-webkit-details-marker{display:none}
.add[open] summary{margin-bottom:8px}
.ag{margin-bottom:6px}.ag small{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surf);font-size:13px;color:var(--ink)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip::before{content:"+ ";color:var(--faint)}
.modal .chip::before{content:none}
.modal .chip{background:var(--bg)}

/* ringkasan */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.bignum{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.facts{list-style:none;padding:0;margin:10px 0;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);color:var(--mut)}
.facts li b{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;background:var(--acc);color:#fff;width:100%}
.btn:hover{background:var(--acc-h)}
.btn.ghost{background:transparent;color:var(--mut);padding:8px;margin-top:6px;font-weight:500}
.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.line{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--bg)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 12px;border-radius:8px;font-size:13px}
.btn.auto{width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.note{border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px;background:var(--warnbg);color:var(--warn)}
.terakhir{color:var(--mut);font-size:12.5px;margin-top:10px;display:flex;gap:6px;align-items:center}
.terakhir::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* perhatian */
.att h2{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pill{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--badbg);color:var(--bad)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.acc{background:var(--accbg);color:var(--acc)}.pill.m{background:var(--bg);color:var(--mut)}
.as{border-top:1px solid var(--line);padding:6px 0 2px}
.as:first-of-type{border-top:0}
.as>button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-weight:600;padding:2px 0 4px}
.as .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--bad)}
.as .cnt.z{color:var(--faint)}
.as .chev{transition:.15s;color:var(--faint);width:15px;height:15px}.as.open .chev{transform:rotate(90deg)}
.al{display:none}.as.open .al{display:block}
.ai{display:flex;align-items:center;gap:10px;padding:5px 0}
.ai .btn{width:auto;flex:none}
.ai .t{flex:1;min-width:0}.ai .t b{display:block;font-size:13px;white-space:nowrap}.ai .t small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nol{color:var(--faint);padding:0 0 6px 23px;font-size:13px}

/* checkbox */
.cb{width:20px;height:20px;border:1.5px solid var(--faint);border-radius:6px;display:grid;place-items:center;color:#fff;flex:none;transition:.12s;background:var(--surf);cursor:pointer}
.cb svg{width:13px;height:13px;stroke-width:3;opacity:0}
.cb.on,.cb.mix{background:var(--acc);border-color:var(--acc)}
.cb.on svg{opacity:1}
.cb.mix::after{content:"";width:9px;height:2.5px;background:#fff;border-radius:2px}.cb.mix svg{display:none}

/* cetak */
.cetak{grid-template-rows:auto auto minmax(0,1fr) auto;gap:14px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dchip{padding:8px 16px;border-radius:10px;background:var(--surf);border:1.5px solid var(--line);font-weight:600;text-align:left;line-height:1.3;min-width:130px;box-shadow:var(--sh)}
.dchip small{display:block;font-weight:500;font-size:11.5px}
.dchip.on{border-color:var(--acc);background:var(--accbg)}
input[type=search]{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit;min-width:240px}
.sw{display:flex;align-items:center;gap:8px;color:var(--mut);cursor:pointer;user-select:none}
.sw i{width:34px;height:20px;border-radius:12px;background:var(--line);position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:.15s}
.sw.on i{background:var(--acc)}.sw.on i::after{left:16px}
.allrow{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;user-select:none}
.slist{overflow:auto;min-height:0;padding:2px}
.ses{background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.ses.sel{border-color:var(--acc)}
.sh{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.sh:hover{background:var(--bg)}
.sh .tx{flex:1}.sh small{display:block;color:var(--mut)}
.chev{transition:.15s;color:var(--faint)}
.open>.sh .chev,.open>.jr .chev{transform:rotate(90deg)}
.sb{display:none;border-top:1px solid var(--line);padding:4px 12px 8px 44px}
.ses.open>.sb{display:block}
.jr{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:9px;cursor:pointer;user-select:none}
.jr:hover{background:var(--bg)}
.jr .nm{flex:1;font-weight:600}.jr .n{color:var(--mut);font-size:12.5px}
.fl{display:none;margin:0 0 6px 20px;border-left:2px solid var(--line);padding-left: 10px}
.jg.open>.fl{display:block}
.fr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none}
.fr:hover{background:var(--bg)}
.fr .fn{flex:1;font:12.5px Consolas,monospace;word-break:break-all}
.fr .n{color:var(--mut);font-size:12px;white-space:nowrap}
.fr.done .fn{color:var(--faint)}
.dock{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:0 4px 16px rgba(16,24,40,.08);flex-wrap:wrap}
.dock select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;max-width:300px}
.jobs{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--faint);padding:34px;text-align:center}

/* runner */
#v-runner{grid-template-columns:330px minmax(0,1fr);gap:24px}
.steps{overflow:auto;min-height:0}
.stp{display:flex;align-items:center;gap:12px;padding:8px 4px;color:var(--faint)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.dot svg{width:12px;height:12px;stroke-width:3;opacity:0}
.stp.run{color:var(--ink);font-weight:600}.stp.run .dot{border-color:var(--acc);border-top-color:transparent;animation:sp .8s linear infinite}
.stp.done{color:var(--mut)}.stp.done .dot{background:var(--ok);border-color:var(--ok)}.stp.done .dot svg{opacity:1}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 14px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.log{flex:1;background:#0f1319;color:#b6c0d4;border-radius:10px;padding:14px;font:12.5px/1.7 Consolas,monospace;overflow:auto;min-height:0}
.log .ok{color:#5fd68a}.log .m{color:#667089}
.rcol{display:flex;flex-direction:column;min-height:0}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.5);display:none;place-items:center;z-index:50}
.ov.on{display:grid}
.modal{background:var(--surf);border-radius:16px;padding:24px;width:min(480px,92vw);max-height:86vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.modal h2{font-size:18px;margin-bottom:6px}.modal p{color:var(--mut);margin-bottom:12px}
.modal .chips{margin-top:6px}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.acts .btn{width:auto}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#151a24;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:60}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(max-width:1100px){.view.two.on{display:block;overflow:auto}.col,.side{overflow:visible}.side{margin-top:16px}.top{flex-wrap:wrap}.view.cetak.on{overflow:auto}}

.log .e{color:#ff7a7a}.log .w{color:#ffc15e}
.stp.err{color:var(--bad)}.stp.err .dot{background:var(--bad);border-color:var(--bad)}.stp.err .dot svg{opacity:1}
.ai .t small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<svg style="display:none">
 <symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
 <symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
 <symbol id="print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/></symbol>
 <symbol id="box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
 <symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
 <symbol id="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
 <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 019.5 4 8 8 0 1020 14z"/></symbol>
 <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<nav class="rail">
  <div class="brand"><svg><use href="#box"/></svg></div>
  <button class="tab on" data-v="harian"><svg><use href="#play"/></svg>Harian<i class="bd" id="bd">4</i></button>
  <button class="tab" data-v="event"><svg><use href="#bolt"/></svg>Event</button>
  <button class="tab" data-v="cetak"><svg><use href="#print"/></svg>Cetak</button>
  <div class="sp"></div>
  <button class="tab" id="tema" title="Ganti tema"><svg><use href="#moon"/></svg>Tema</button>
</nav>

<main>
  <div class="top">
    <h1 id="judul">Harian</h1>
    <div class="sp"></div>
    <div class="meta">
      <span>Operator</span><select id="op"></select><button class="ib" id="opAdd" title="Tambah operator"><svg style="width:16px;height:16px"><use href="#plus"/></svg></button>
      <span class="clock" id="jam"></span>
    </div>
  </div>

  <section class="view two on" id="v-harian"></section>
  <section class="view two" id="v-event"></section>

  <section class="view cetak" id="v-cetak">
    <div class="bar"><div class="bar" id="hari"></div><div class="sp"></div>
      <input type="search" id="cari" placeholder="Cari file, SKU, atau PICK…">
      <label class="sw on" id="swBelum" title="Sembunyikan yang sudah dicetak" aria-label="Sembunyikan yang sudah dicetak"><i></i></label></div>
    <div class="bar"><label class="allrow" id="allRow" title="Pilih semua" aria-label="Pilih semua"><span class="cb" id="allCb"><svg><use href="#check"/></svg></span></label><span class="pill m" id="cTot"></span></div>
    <div class="slist" id="slist"></div>
    <div class="dock">
      <b id="cInfo">Belum ada yang dipilih</b><div class="jobs" id="jobs"></div><div class="sp"></div>
      <select id="printer"><option>Printer Thermal 100×150 — Ruang Resi</option><option>Printer Thermal 2 — Lantai 2</option><option>Simpan sebagai PDF</option></select>
      <button class="btn auto" id="cetakBtn" disabled><svg><use href="#print"/></svg>Cetak</button>
    </div>
  </section>

  <section class="view" id="v-runner">
    <div class="card" style="display:flex;flex-direction:column;min-height:0">
      <button class="btn line auto" id="kembali" style="margin-bottom:14px"><svg><use href="#back"/></svg>Kembali</button>
      <div style="display:flex;align-items:baseline"><h2 id="rJudul" style="font-size:17px;flex:1"></h2><b id="rPct" style="font-variant-numeric:tabular-nums">0%</b></div>
      <div class="prog"><i id="rBar"></i></div>
      <div class="steps" id="rSteps"></div>
    </div>
    <div class="rcol">
      <div style="display:flex;align-items:center;margin-bottom:10px"><h2 style="font-size:15px">Aktivitas</h2><div class="sp"></div>
        <button class="btn danger auto sm" id="rStop">Hentikan</button></div>
      <div class="log" id="rLog"></div>
    </div>
  </section>
</main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ic=n=>`<svg><use href="#${n}"/></svg>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2400)}
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('on')}
function tutup(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')tutup()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')tutup()});
const TERSAMBUNG=location.protocol.startsWith('http');   // dibuka lewat server_ui.py = data & proses sungguhan
async function api(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
const postJ=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const simpanLokal=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const MENIT_LANGKAH=2.5;     // perkiraan kasar durasi per langkah
const jamDesimal=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60};
function recNow(k){const h=jamDesimal(),p=CFG[k].preset.find(p=>h>=p.dari&&h<p.sampai);return p?p.id:5}
let HINFO=null;
function luarJam(p){   // server tahu jam sungguhan; tanpa server: tebakan lokal
  if(TERSAMBUNG&&HINFO&&HINFO.jam_ok){return p.nama in HINFO.jam_ok?HINFO.jam_ok[p.nama]===false:false}
  return p.id!==recNow(p.nama.startsWith('EVENT')?'event':'harian');
}

const S={harian:{pilih:new Set(),aktif:null,tampil:true},event:{pilih:new Set(),aktif:null,tampil:true}};
const urut=k=>CFG[k].grup.flatMap(g=>g[1]).filter(x=>S[k].pilih.has(x));
const grupDari=(k,x)=>CFG[k].grup.find(g=>g[1].includes(x))[0];
function bangun(k){
  const c=CFG[k],m=S[k],el=$('#v-'+k),sel=urut(k),p=c.preset.find(x=>x.id===m.aktif),rec=recNow(k);
  const konf=c.konflik(m.pilih);
  const noSel=c.grup.map(([g,ls])=>[g,ls.filter(x=>!m.pilih.has(x))]).filter(g=>g[1].length);
  const adaGab=c.kGab.some(x=>m.pilih.has(x)),adaDis=c.kDis.some(x=>m.pilih.has(x));
  el.innerHTML=`
   <div class="col">
     <div class="lbl">Jadwal hari ini</div>
     <div class="sched">${c.preset.map(x=>`<button class="pk ${m.aktif===x.id?'on':''}" data-id="${x.id}"><b>${x.nama.replace('EVENT - ','')}</b><span class="j" title="${x.jam}">${x.jam.split(' · +')[0]}</span>${x.id===rec?'<i class="nowdot" title="Sesuai jam sekarang"></i>':''}</button>`).join('')}</div>

     <div class="lbl tgl ${m.tampil?'open':''}" id="tglUrut" role="button" tabindex="0">${ic('chev').replace('<svg','<svg class="chev"')}Urutan langkah <span class="n">${sel.length}</span><div class="sp"></div>${m.tampil&&sel.length?'<button id="clr">Kosongkan</button>':''}<span class="hid">${m.tampil?'Sembunyikan':'Tampilkan'}</span></div>
     <div class="urut" ${m.tampil?'':'hidden'}><div class="pipe">${sel.length?sel.map((x,i)=>{const kf=(adaGab&&adaDis)&&(c.kGab.includes(x)||c.kDis.includes(x));
        return `<div class="ps ${kf?'konf':''}"><span class="no">${i+1}</span><span class="nm">${esc(x)}</span>${kf?`<span class="tg">${c.kGab.includes(x)?'gabung':'dipisah'}</span>`:`<span class="gp">${esc(grupDari(k,x))}</span>`}
        <button class="rm" data-rm="${esc(x)}" title="Hapus langkah" aria-label="Hapus ${esc(x)}">${ic('x')}</button></div>`}).join(''):'<div class="kosong">Belum ada langkah — pilih paket di atas atau tambahkan langkah secara manual.</div>'}</div>
     <details class="add" ${sel.length?'':'open'}><summary>${ic('plus')}Tambah langkah <span style="color:var(--faint);font-weight:400">· ${noSel.reduce((a,g)=>a+g[1].length,0)} tersedia</span></summary>
       ${noSel.map(([g,ls])=>`<div class="ag"><small>${esc(g)}</small><div class="chips">${ls.map(x=>`<button class="chip" data-add="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`).join('')||'<div class="nol">Semua langkah sudah dipilih.</div>'}
     </details></div>
   </div>

   <aside class="side">
     <div class="card">
       <div style="display:flex;align-items:baseline;gap:8px"><span class="bignum">${sel.length}</span><span style="color:var(--mut)">langkah</span></div>
       <div style="color:var(--mut)">${p?esc(p.nama)+' · '+p.jam:sel.length?'Susunan kustom':'Belum ada paket dipilih'}</div>
       <ul class="facts"><li>Operator<b>${esc(OP.aktif)}</b></li><li>Perkiraan durasi<b>${sel.length?'±'+Math.round(sel.length*MENIT_LANGKAH)+' menit':'—'}</b></li></ul>
       ${p&&luarJam(p)?`<div class="note" style="margin:0 0 12px">Sekarang di luar jam ${esc(p.nama)} (${p.jam.split(' · +')[0]}). Pastikan tidak salah pilih.</div>`:''}
       ${konf?`<div class="note" style="margin:0 0 12px">${konf}</div>`:''}
       <button class="btn" id="go" ${sel.length?'':'disabled'}>${ic('play')}Jalankan${sel.length?' '+sel.length+' langkah':''}</button>
     </div>
     ${k==='harian'?attHtml():''}

  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{m.pilih.delete(b.dataset.rm);m.aktif=null;bangun(k)});
  el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{m.pilih.add(b.dataset.add);m.aktif=null;bangun(k);$('#v-'+k+' details.add').open=true});
  const cl=el.querySelector('#clr');if(cl)cl.onclick=e=>{e.stopPropagation();m.pilih=new Set();m.aktif=null;bangun(k)};
  const tu=el.querySelector('#tglUrut'),flip=()=>{m.tampil=!m.tampil;bangun(k)};tu.onclick=flip;tu.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  el.querySelector('#go').onclick=()=>konfirmasi(k,sel,p?p.nama:(k==='event'?'EVENT - KUSTOM':'Kustom'));
  if(k==='harian')pasangAtt(el);
}

if(!TERSAMBUNG){   // contoh untuk mode tanpa server

const attBuka=new Set(['terlompat','resi','gagal','pdf']),pilPdf=new Set();let attTampil=false;
const attTotal=()=>ATT.terlompat.length+ATT.resi.length+ATT.gagal.length+ATT.pdf.length;

function attHtml(){

     `<button class="btn sm" id="ulang" style="width:100%;margin:4px 0 6px" ${pilPdf.size?'':'disabled'}>Download ulang${pilPdf.size?' ('+pilPdf.size+')':''}</button>`,

async function salin(t){let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){
    const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();
    try{ok=document.execCommand('copy')}catch(e2){}a.remove()}
  toast(ok?'Disalin: '+(t.length>60?t.slice(0,57)+'…':t):'Gagal menyalin — salin manual dari daftar');}
function pasangAtt(el){
  const n=attTotal();$('#bd').textContent=n;$('#bd').style.display=n?'':'none';
  const ah=el.querySelector('#attHead'),flip=()=>{attTampil=!attTampil;bangun('harian')};ah.onclick=flip;ah.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  el.querySelectorAll('.as>button').forEach(b=>b.onclick=()=>{const id=b.parentNode.dataset.as;attBuka.has(id)?attBuka.delete(id):attBuka.add(id);bangun('harian')});
  el.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const j=b.dataset.ok,t=b.dataset.t;tandaiDicek(t);ATT[j]=ATT[j].filter(r=>r!==t);toast('Ditandai sudah dicek');bangun('harian')});
  el.querySelectorAll('[data-salin]').forEach(b=>b.onclick=()=>salin(b.dataset.salin));
  el.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{const k=b.dataset.pdf;
    if(k==='*'){pilPdf.size===ATT.pdf.length?pilPdf.clear():ATT.pdf.forEach(r=>pilPdf.add(r.picklist))}else pilPdf.has(k)?pilPdf.delete(k):pilPdf.add(k);bangun('harian')});
  const u=el.querySelector('#ulang');if(u)u.onclick=konfirmasiUlang;
}
async function muatPeringatan(){
  const d=await api('/api/harian/info');HINFO=d;const P=d.peringatan,sembunyi=x=>x.filter(m=>!dicek.has(m));
  ATT.terlompat=sembunyi(P.picklist);ATT.resi=sembunyi(P.resi);ATT.gagal=sembunyi(P.gagal);
  await muatTerhenti().catch(()=>{});bangun('harian');bangun('event');return d;
}
/* ---------- gagal unduh PDF: pilih lalu download ulang (SUNGGUHAN lewat server) ---------- */
let pollT=null;
async function muatTerhenti(){
  const d=await api('/api/terhenti');ATT.pdf=d.daftar;
  [...pilPdf].forEach(k=>{if(!ATT.pdf.some(x=>x.picklist===k))pilPdf.delete(k)});
  return d;
}
function konfirmasiUlang(){
  const pilih=[...pilPdf];
  modal(`<h2>Download ulang ${pilih.length} picklist?</h2><p>Picklist dilanjutkan berurutan dari langkah yang gagal (picking → resi → unduh label PDF) dan dicatat di Jubelio. PDF masuk ke folder sesi asalnya.</p><div class="chips">${pilih.map(p=>`<span class="chip mono" style="pointer-events:none">${esc(p)}</span>`).join('')}</div>
   <div class="acts"><button class="btn line" onclick="tutup()">Batal</button><button class="btn" id="yaUlang">Ya, jalankan</button></div>`);
  $('#yaUlang').onclick=async()=>{
    if(!TERSAMBUNG){ATT.pdf=ATT.pdf.filter(r=>!pilPdf.has(r.picklist));pilPdf.clear();tutup();toast('Unduh ulang selesai ✓');return bangun('harian')}
    try{await postJ('/api/terhenti/jalankan',{picklist:pilih})}catch(e){tutup();return toast('Gagal mulai: '+e.message)}
    tampilUlang()};
}
function tampilUlang(){
  modal(`<h2 id="uT">Download ulang…</h2><div class="prog"><i id="uBar"></i></div>
   <pre id="uLog" class="log" style="max-height:260px;min-height:120px;white-space:pre-wrap"></pre>
   <div class="acts"><button class="btn" id="uTutup" disabled>Tutup</button></div>`);
  $('#uTutup').onclick=()=>{clearInterval(pollT);tutup()};
  clearInterval(pollT);pollT=setInterval(tickUlang,1500);tickUlang();
}
async function tickUlang(){
  try{const d=await muatTerhenti(),j=d.job;if(!j||!$('#uT'))return;
    const run=j.status==='jalan';
    $('#uT').textContent=run?`Download ulang — ${j.maju}/${j.total}`:(j.status==='selesai'?'Selesai ✓ semua berhasil':`Selesai — ${j.gagal} masih gagal`);
    $('#uBar').style.width=Math.round(j.maju/Math.max(1,j.total)*100)+'%';
    $('#uLog').textContent=j.lines.slice(-80).join('\n');$('#uLog').scrollTop=1e6;$('#uTutup').disabled=run;
    bangun('harian');
    if(!run){clearInterval(pollT);muatPeringatan().catch(()=>{})}
  }catch(e){}
}

/* ---------- operator (kolom F PICKLIST.xlsx; aturan sama dengan operator_aktif.py) ---------- */
const OP={aktif:'PUTRI',daftar:['PUTRI','ALFIANA','SAHRUL','DENADA','SELVI']};
let OPAPI=false;
const normOp=n=>{n=String(n||'').split(/\s+/).filter(Boolean).join(' ').toUpperCase();
  if(!n)throw new Error('Nama operator tidak boleh kosong');if(n.length>30)throw new Error('Nama operator terlalu panjang (maks 30 karakter)');return n};
const opTerkunci=()=>running||(OPAPI&&!!OP.terkunci);
function gambarOp(d){if(d)Object.assign(OP,{aktif:d.aktif,daftar:d.daftar,terkunci:d.terkunci});
  const sel=$('#op'),k=opTerkunci(),html=OP.daftar.map(n=>`<option ${n===OP.aktif?'selected':''}>${esc(n)}</option>`).join('');
  if(sel.innerHTML!==html)sel.innerHTML=html;sel.disabled=k;
  sel.title=k?'Tidak bisa diganti saat proses berjalan (satu sesi tidak boleh memuat dua operator)':'Operator yang tercatat di kolom F PICKLIST.xlsx';}
async function opUbah(aksi,nama){
  if(OPAPI)gambarOp(await postJ('/api/operator',{aksi,nama}));
  else{nama=normOp(nama);
    if(aksi==='tambah'){if(OP.daftar.includes(nama))throw new Error(`Operator ${nama} sudah ada di daftar`);OP.daftar.push(nama)}
    else{if(opTerkunci())throw new Error('Operator tidak bisa diganti saat proses berjalan');if(!OP.daftar.includes(nama))throw new Error(`Operator ${nama} belum ada di daftar`);OP.aktif=nama}
    gambarOp()}
  bangun('harian');bangun('event');
}
$('#op').onchange=async e=>{try{await opUbah('aktif',e.target.value);toast('Operator aktif: '+OP.aktif)}catch(x){toast(x.message);gambarOp()}};
$('#opAdd').onclick=()=>{modal(`<h2>Tambah operator</h2><p>Nama ditulis huruf besar dan masuk ke daftar. Operator aktif tidak berubah — pilih di daftar untuk mengaktifkan.</p><input id="opN" maxlength="30" placeholder="Nama operator"><div id="opE" style="color:var(--bad);font-weight:600;min-height:20px;margin-top:6px"></div>
  <div class="acts"><button class="btn line" onclick="tutup()">Batal</button><button class="btn" id="opS">Tambah</button></div>`);
  const s=async()=>{try{const n=normOp($('#opN').value);await opUbah('tambah',n);tutup();toast('Operator '+n+' ditambahkan (pilih di daftar untuk mengaktifkan)')}catch(x){$('#opE').textContent=x.message}};
  $('#opS').onclick=s;$('#opN').onkeydown=e=>{if(e.key==='Enter')s()};$('#opN').focus()};
async function initOperator(){
  gambarOp();setInterval(()=>gambarOp(),1500);
  if(!TERSAMBUNG)return;
  const muat=async()=>{try{OPAPI=true;gambarOp(await api('/api/operator'))}catch(e){OPAPI=false}};
  await muat();setInterval(muat,5000);
}

/* ---------- navigasi ---------- */
const JUD={harian:'Harian',event:'Event',cetak:'Cetak label',runner:'Proses berjalan'};
let asal='harian';
function go(v){
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  $$('.rail .tab[data-v]').forEach(t=>t.classList.toggle('on',t.dataset.v===(v==='runner'?asal:v)));
  $('#judul').textContent=JUD[v];
}
$$('.rail .tab[data-v]').forEach(t=>t.onclick=()=>{const v=t.dataset.v;if(running&&v===runDari){asal=v;return go('runner')}asal=v;go(v)});
$('#tema').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';simpanLokal('tema',r.dataset.theme)};
{const t=bacaLokal('tema',null);if(t)document.documentElement.dataset.theme=t}
const tickJam=()=>$('#jam').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');setInterval(tickJam,1000);tickJam();

/* =========================================================
   KONFIRMASI & RUNNER (SUNGGUHAN lewat jalankan_harian.py bila tersambung)
   ========================================================= */
let running=false,runDari='harian',timer=null,apiJob=false,poll=null,off=0,gagalPoll=0,runList=[],runStat=[];
function konfirmasi(k,list,nama){
  if(running){toast('Masih ada proses berjalan');asal=runDari;return go('runner')}
  modal(`<h2>Jalankan ${esc(nama)}?</h2><p>${list.length} langkah berurutan. Picklist, resi, dan label akan <b>dibuat di Jubelio</b>.${!TERSAMBUNG?' <span style="color:var(--warn)">(Mode contoh — tidak menyentuh Jubelio.)</span>':''}</p>
   <div class="chips">${list.map((x,i)=>`<span class="chip" style="pointer-events:none"><b style="color:var(--acc)">${i+1}</b> ${esc(x)}</span>`).join('')}</div>
   <div class="acts"><button class="btn line" onclick="tutup()">Batal</button><button class="btn" id="yes">Ya, jalankan</button></div>`);
  $('#yes').onclick=()=>{tutup();TERSAMBUNG?jalankanAPI(k,list,nama):mulaiContoh(k,list,nama)};
}
function siapRunner(k,list,nama){
  runDari=k;asal=k;runList=list;runStat=list.map(()=>'');
  $('#rJudul').textContent=nama;$('#rLog').innerHTML='';$('#rBar').style.width='0';$('#rPct').textContent='0%';
  $('#rStop').style.display='';drawSteps();go('runner');
}
function drawSteps(){
  $('#rSteps').innerHTML=runList.map((x,i)=>`<div class="stp ${runStat[i]||''}"><span class="dot">${ic(runStat[i]==='err'?'x':'check')}</span>${esc(x)}${runStat[i]==='skip'?' <span class="pill m">dilewati</span>':''}</div>`).join('');
  const r=$('#rSteps .run');r&&r.scrollIntoView({block:'nearest'});
}
function logBaris(t,c=''){const l=$('#rLog');l.insertAdjacentHTML('beforeend',`<div class="${c}">${esc(t)||'&nbsp;'}</div>`);l.scrollTop=l.scrollHeight}
function setPct(p){$('#rBar').style.width=p+'%';$('#rPct').textContent=p+'%'}
function selesaiRunner(){running=false;apiJob=false;$('#rStop').style.display='none';gambarOp()}
$('#kembali').onclick=()=>go(asal);
/* mode contoh (tanpa server) */
function mulaiContoh(k,list,nama){
  running=true;gambarOp();siapRunner(k,list,nama);let i=0;
  const next=()=>{if(i>0)runStat[i-1]='done';setPct(Math.round(i/list.length*100));
    if(i>=list.length){logBaris('Selesai. Semua langkah berhasil.','ok');drawSteps();selesaiRunner();toast('Proses selesai ✓');return}
    runStat[i]='run';drawSteps();logBaris(new Date().toTimeString().slice(0,8)+'  ▶ '+list[i]);i++;timer=setTimeout(next,900)};
  next();
}
$('#rStop').onclick=()=>{
  modal(`<h2>Hentikan proses?</h2><p>Langkah yang sedang berjalan dimatikan dan sisanya dibatalkan. Picklist yang sedang dibuat bisa tidak lengkap — cek di Jubelio.</p>
   <div class="acts"><button class="btn line" onclick="tutup()">Lanjutkan</button><button class="btn danger" id="yaStop">Ya, hentikan</button></div>`);
  $('#yaStop').onclick=async()=>{tutup();
    if(apiJob){try{await postJ('/api/harian/hentikan',{})}catch(e){toast(e.message)}return}
    clearTimeout(timer);const i=runStat.indexOf('run');if(i>=0)runStat[i]='err';drawSteps();logBaris('Dihentikan oleh operator.','w');selesaiRunner()};
};
/* mode sungguhan */
async function jalankanAPI(k,list,nama){
  try{await postJ('/api/harian/jalankan',{langkah:list,judul:nama.toUpperCase()})}catch(e){return toast('Gagal mulai: '+e.message)}
  apiJob=true;running=true;gambarOp();siapRunner(k,list,nama);mulaiPoll();
}
function logApi(t){const c=/ERROR|GAGAL|Traceback/i.test(t)?'e':/WARNING|PERHATIAN|!!!|DILEWATI|DIHENTIKAN/i.test(t)?'w':/^===/.test(t)?'ok':'';logBaris(t,c)}
function mulaiPoll(){off=0;gagalPoll=0;clearInterval(poll);poll=setInterval(tickAPI,1000);tickAPI()}
async function tickAPI(){
  try{const j=await api('/api/harian/job?dari='+off);gagalPoll=0;
    j.lines.forEach(logApi);off=j.total;
    const map={antri:'',jalan:'run',selesai:'done',gagal:'err'};
    runList=j.langkah.map(x=>x.nama);runStat=j.langkah.map(x=>map[x.status]);drawSteps();
    const sel=j.langkah.filter(x=>x.status==='selesai'||x.status==='gagal').length;setPct(Math.round(sel/Math.max(1,j.langkah.length)*100));
    if(j.status!=='jalan'){clearInterval(poll);selesaiRunner();if(j.status==='selesai')setPct(100);
      toast(j.status==='selesai'?'Proses selesai ✓':j.status==='dihentikan'?'Proses dihentikan':'Selesai — ada langkah gagal, cek aktivitas');
      muatPeringatan().catch(()=>{})}
  }catch(e){if(++gagalPoll>=5){clearInterval(poll);selesaiRunner();logBaris('Koneksi ke server terputus: '+e.message,'e')}}
}

/* =========================================================
   CETAK — sesi → jenis → file (pilih per sesi / per jenis / per file)
   ========================================================= */
const JENIS={
 'Spesial':['SPESIAL_TRC1','SPESIAL_TRC4','SPESIAL_T01-PTAA-5','SPESIAL_C226-GTJ-1','SPESIAL_GL-FNA-2'],
 'Satuan':['1QTY-REGULER-2A','1QTY-REGULER-3A','1QTY-REGULER-1B','1QTY-REGULER-LAINNYA'],
 'Kombinasi':['KOMBINASI-REGULER-LANTAI1','KOMBINASI-REGULER-LANTAI2','KOMBINASI-REGULER-LAINNYA'],
 'GTL-SiCepat':['URGENT-GTL-SICEPAT-LANTAI1','URGENT-GTL-SICEPAT-LANTAI2']};
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
let HARI0=new Date(),API=false;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function rnd(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
const CACHE={};
function dataHari(t){
  if(CACHE[t])return CACHE[t];
  if(API)return CACHE[t]=[];
  const r=rnd(+t.split('-').join('')%997),n=2+Math.floor(r()*2),hariIni=t===iso(HARI0),out=[];let pick=104700+Math.floor(r()*100);
  for(let i=1;i<=n;i++){const jam=['07.05','10.18','13.02','16.04'][i-1],hh=jam.replace('.','');
    out.push({id:t+'/'+i,no:i,jam,jenis:Object.keys(JENIS).map(j=>({nama:j,files:JENIS[j].map(lb=>({f:'PICK-000'+(pick++)+'_'+lb+'_'+t+'_'+hh+String(10+Math.floor(r()*49))+'.pdf',rel:'',n:Math.floor(r()*60)+4,done:!(hariIni&&i===n)&&r()<.6}))}))})}
  return CACHE[t]=out;
}
let tgl=iso(HARI0),bukaS=new Set(),bukaJ=new Set(),pil=new Set(),sembunyi=true,kata='',ss=[];
const lb=x=>API?'':` · ${x} label`;
const kf=(sid,j,f)=>sid+'|'+j+'|'+f;
const cocok=f=>!kata||f.f.toLowerCase().includes(kata);
const fVis=j=>j.files.filter(f=>!(sembunyi&&f.done)&&cocok(f));
const jVis=s=>s.jenis.filter(j=>fVis(j).length);
const kJ=(s,j)=>fVis(j).map(f=>kf(s.id,j.nama,f.f));
const kS=s=>jVis(s).flatMap(j=>kJ(s,j));
const stt=ks=>{const p=ks.filter(k=>pil.has(k)).length;return !ks.length?'':p===ks.length?'on':p?'mix':''};
const toggleKeys=ks=>{const all=ks.length&&ks.every(k=>pil.has(k));ks.forEach(k=>all?pil.delete(k):pil.add(k))};
const chk=ic('check');
const sumN=(arr)=>arr.reduce((a,f)=>a+(f.n||0),0);
function gambarCetak(){
  $('#hari').innerHTML=[0,1,2].map(i=>{const d=new Date(HARI0);d.setDate(d.getDate()-i);const t=iso(d);
    const blm=dataHari(t).reduce((a,s)=>a+s.jenis.reduce((b,j)=>b+j.files.filter(f=>!f.done).reduce((c,f)=>c+(API?1:f.n),0),0),0);
    return `<button class="dchip ${t===tgl?'on':''}" data-t="${t}">${['Hari ini','Kemarin','2 hari lalu'][i]} · ${d.getDate()} ${BLN[d.getMonth()]}<small style="color:${blm?'var(--warn)':'var(--ok)'}">${blm?blm+(API?' file':' label')+' belum dicetak':'semua tercetak'}</small></button>`}).join('');
  ss=dataHari(tgl);let total=0,nFile=0,jset=new Set(),sset=0,all=0;
  $('#slist').innerHTML=[...ss].reverse().map(s=>{
    const jv=jVis(s),ks=kS(s),p=ks.filter(k=>pil.has(k)).length,tot=jv.reduce((a,j)=>a+sumN(fVis(j)),0);
    all+=ks.length;if(p)sset++;
    jv.forEach(j=>fVis(j).forEach(f=>{if(pil.has(kf(s.id,j.nama,f.f))){total+=f.n||0;nFile++;jset.add(j.nama)}}));
    const sS=stt(ks),open=bukaS.has(s.id)||(kata&&ks.length);
    return `<div class="ses ${sS?'sel':''} ${open?'open':''}" data-s="${esc(s.id)}">
     <div class="sh"><span class="cb ${sS}" data-act="cs">${chk}</span><span class="tx"><b>Sesi ${s.no}</b> <span style="color:var(--mut)">· ${s.jam}</span>
       <small>${ks.length?jv.length+' jenis · '+ks.length+' file'+lb(tot)+(p?' · '+p+' dipilih':''):'tidak ada file'+(kata?' yang cocok':' — semua sudah tercetak')}</small></span>
       ${ks.length?'':`<span class="pill ok">${kata?'—':'Selesai'}</span>`}<span class="chev">${ic('chev')}</span></div>
     <div class="sb">${jv.map(j=>{const kj=kJ(s,j),sj=stt(kj),bj=bukaJ.has(s.id+'|'+j.nama)||(kata&&kj.length);
       return `<div class="jg ${bj?'open':''}" data-j="${esc(s.id)}|${esc(j.nama)}"><div class="jr"><span class="cb ${sj}" data-act="cj">${chk}</span><span class="nm">${esc(j.nama)}</span><span class="n">${kj.length} file${lb(sumN(fVis(j)))}</span><span class="chev">${ic('chev')}</span></div>
        <div class="fl">${fVis(j).map(f=>`<div class="fr ${f.done?'done':''}" data-k="${esc(kf(s.id,j.nama,f.f))}"><span class="cb ${pil.has(kf(s.id,j.nama,f.f))?'on':''}">${chk}</span><span class="fn">${esc(f.f)}</span>${f.done?'<span class="pill ok">tercetak</span>':''}<span class="n">${API?f.kb+' KB':f.n+' label'}</span></div>`).join('')}</div></div>`}).join('')}</div></div>`}).join('')||'<div class="empty">Belum ada sesi</div>';
  $('#allCb').className='cb '+(all&&pil.size===all?'on':pil.size?'mix':'');
  $('#cTot').textContent=pil.size+' dari '+all+' file dipilih';$('#cTot').className='pill '+(pil.size?'acc':'m');
  $('#cInfo').textContent=pil.size?`${sset} sesi · ${jset.size} jenis · ${nFile} file${lb(total)}`:'Belum ada yang dipilih';
  updBtn();
}
$('#slist').onclick=e=>{
  const fr=e.target.closest('.fr'),jg=e.target.closest('.jg'),se=e.target.closest('.ses');if(!se)return;
  const s=ss.find(x=>x.id===se.dataset.s);
  if(fr){const k=fr.dataset.k;pil.has(k)?pil.delete(k):pil.add(k)}
  else if(jg){const j=s.jenis.find(x=>x.nama===jg.dataset.j.split('|')[1]);
    if(e.target.closest('[data-act=cj]'))toggleKeys(kJ(s,j));else{const key=jg.dataset.j;bukaJ.has(key)?bukaJ.delete(key):bukaJ.add(key)}}
  else if(e.target.closest('.sh')){if(e.target.closest('[data-act=cs]'))toggleKeys(kS(s));else bukaS.has(s.id)?bukaS.delete(s.id):bukaS.add(s.id)}
  gambarCetak()};
$('#hari').onclick=e=>{const b=e.target.closest('.dchip');if(!b)return;tgl=b.dataset.t;pil.clear();bukaS.clear();bukaJ.clear();gambarCetak()};
$('#allRow').onclick=()=>{toggleKeys(ss.flatMap(kS));gambarCetak()};
$('#cari').oninput=e=>{kata=e.target.value.trim().toLowerCase();gambarCetak()};
const pangkasPilihan=()=>{const ada=new Set(ss.flatMap(kS));[...pil].forEach(k=>{if(!ada.has(k))pil.delete(k)})};
$('#swBelum').onclick=()=>{sembunyi=!sembunyi;$('#swBelum').classList.toggle('on',sembunyi);pangkasPilihan();gambarCetak()};

/* ---------- job cetak per printer ---------- */
const cjobs={};let modalPrinter=null;
function updBtn(){const p=$('#printer').value,j=cjobs[p],sibuk=!!(j&&j.status==='jalan');$('#cetakBtn').disabled=!pil.size||sibuk;$('#cetakBtn').title=sibuk?'Printer ini sedang mencetak — pilih printer lain':''}
$('#printer').onchange=updBtn;
function gambarJobs(){
  $('#jobs').innerHTML=Object.keys(cjobs).map(p=>{const j=cjobs[p],run=j.status==='jalan';
    return `<button class="pill ${run?'acc':j.status==='selesai'?'ok':''}" data-p="${esc(p)}" style="cursor:pointer;${!run&&j.status!=='selesai'?'background:var(--badbg);color:var(--bad)':''}" title="Lihat catatan cetak">${run?j.maju+'/'+j.total:j.status==='selesai'?'✓':'!'} · ${esc(p.split(' — ')[0])}</button>`}).join('');
  $$('#jobs button').forEach(b=>b.onclick=()=>tampilJob(b.dataset.p));updBtn();
}
function tampilJob(p){
  modalPrinter=p;
  modal(`<h2 id="jT"></h2><div class="prog"><i id="jBar"></i></div>
   <pre id="jLog" class="log" style="max-height:260px;min-height:120px;white-space:pre-wrap"></pre>
   <div class="acts"><button class="btn line" id="jSemb">Sembunyikan</button><button class="btn" id="jTutup">Tutup</button></div>`);
  $('#jSemb').onclick=()=>{modalPrinter=null;tutup()};
  $('#jTutup').onclick=()=>{const j=cjobs[p];if(j&&j.status!=='jalan')delete cjobs[p];modalPrinter=null;tutup();gambarJobs()};
  renderJob();
}
function renderJob(){
  const p=modalPrinter,j=p&&cjobs[p];if(!j||!$('#jT'))return;const run=j.status==='jalan';
  $('#jT').textContent=run?`Mencetak ke ${p} — ${j.maju}/${j.total}`:(j.status==='selesai'?`Selesai ✓ — ${p}`:`Selesai dengan masalah — ${p}`);
  $('#jBar').style.width=Math.round((run?j.maju:j.total)/Math.max(1,j.total)*100)+'%';
  $('#jLog').textContent=j.lines.slice(-60).join('\n');$('#jLog').scrollTop=1e6;
  $('#jTutup').disabled=run;$('#jTutup').title=run?'Masih mencetak — pakai Sembunyikan untuk menutup tanpa menghentikan':'';
}
function lacak(p,total){
  if(cjobs[p])clearInterval(cjobs[p].iv);
  cjobs[p]={status:'jalan',total,maju:0,lines:[],iv:null};cjobs[p].iv=setInterval(()=>tickCetak(p),1000);gambarJobs();
}
async function tickCetak(p){
  const c=cjobs[p];if(!c)return;
  try{const j=await api('/api/job?printer='+encodeURIComponent(p));
    c.lines=j.lines||[];c.total=j.total||c.total;
    const m=[...c.lines].reverse().map(x=>x.match(/\[(\d+)\/(\d+)\] Mencetak/)).find(Boolean);if(m)c.maju=+m[1]-1;
    if(j.status!=='jalan'){clearInterval(c.iv);c.status=j.status;c.maju=c.total;
      await muatData();pangkasPilihan();gambarCetak();toast(j.status==='selesai'?`${p}: selesai dicetak ✓`:`${p}: selesai dengan masalah`)}
  }catch(e){clearInterval(c.iv);c.status='gagal';c.lines.push('Koneksi ke server terputus: '+e.message)}
  gambarJobs();renderJob();
}
$('#cetakBtn').onclick=()=>{
  const g={};let tot=0,nf=0;
  ss.forEach(s=>s.jenis.forEach(j=>j.files.forEach(f=>{if(pil.has(kf(s.id,j.nama,f.f))){const n='Sesi '+s.no+' · '+j.nama;g[n]=(g[n]||0)+1;tot+=f.n||0;nf++}})));
  modal(`<h2>Cetak ${nf} file${API?'':' ('+tot+' label)'}?</h2><p>Printer: <b>${esc($('#printer').value)}</b><br>Tanggal ${tgl}, urut dari sesi terlama ke terbaru.</p><div class="chips">${Object.keys(g).map(n=>`<span class="chip" style="pointer-events:none">${esc(n)} · ${g[n]} file</span>`).join('')}</div>
   <div class="acts"><button class="btn line" onclick="tutup()">Batal</button><button class="btn" id="yaC">Cetak</button></div>`);
  $('#yaC').onclick=async()=>{tutup();const printer=$('#printer').value;
    if(API){const files=[];ss.forEach(s=>s.jenis.forEach(j=>j.files.forEach(f=>{if(pil.has(kf(s.id,j.nama,f.f)))files.push(f.rel)})));
      try{await postJ('/api/cetak',{files,printer})}catch(e){return toast('Gagal mulai: '+e.message)}
      pil.clear();gambarCetak();lacak(printer,files.length);tampilJob(printer);return}
    /* mode contoh */
    const mark=[];ss.forEach(s=>s.jenis.forEach(j=>j.files.forEach(f=>{if(pil.has(kf(s.id,j.nama,f.f)))mark.push(f)})));
    const c=cjobs[printer]={status:'jalan',total:nf,maju:0,lines:[],iv:null};pil.clear();gambarCetak();gambarJobs();toast('Mengirim '+nf+' file ke printer…');
    c.iv=setInterval(()=>{if(c.maju<c.total)c.lines.push(`[${c.maju+1}/${c.total}] Mencetak ${mark[c.maju].f}`);c.maju++;
      if(c.maju>=c.total){clearInterval(c.iv);c.status='selesai';mark.forEach(f=>f.done=true);toast('Selesai dicetak ✓');gambarCetak()}gambarJobs();renderJob()},500)};
};
async function muatData(){
  const d=await api('/api/sesi');Object.keys(CACHE).forEach(k=>delete CACHE[k]);
  HARI0=new Date(d.hari_ini+'T00:00:00');
  d.hari.forEach(h=>{CACHE[h.tanggal]=h.sesi.map(s=>({id:s.id,no:s.no,jam:s.jam,jenis:s.jenis.map(j=>({nama:j.nama,files:j.files.map(f=>({f:f.f,rel:f.rel,kb:f.kb,n:null,done:f.done}))}))}))});
  API=true;return d;
}
async function initCetak(){
  if(TERSAMBUNG){
    try{const dd=await muatData();tgl=dd.hari.length?dd.hari[dd.hari.length-1].tanggal:iso(HARI0);
      const p=await api('/api/printer');$('#printer').innerHTML=p.printer.map(x=>`<option>${esc(x)}</option>`).join('');
      try{const jj=(await api('/api/jobs')).jobs;Object.keys(jj).forEach(n=>{if(jj[n].status==='jalan')lacak(n,jj[n].total)})}catch(e){}
      
    }catch(e){toast('Server UI error: '+e.message)}
  }
  gambarCetak();
}

/* ---------- init ---------- */
async function initHarian(){
  const p0=CFG.harian.preset.find(p=>p.id===recNow('harian'));S.harian={pilih:new Set(p0.steps),aktif:p0.id,tampil:true};
  const p1=CFG.event.preset.find(p=>p.id===recNow('event'));S.event={pilih:new Set(p1.steps),aktif:p1.id,tampil:true};
  bangun('harian');bangun('event');
  if(!TERSAMBUNG)return;
  try{const d=await muatPeringatan();
    if(d.berjalan){const j=await api('/api/harian/job?dari=0');const k=/^EVENT/.test(j.judul)?'event':'harian';
      apiJob=true;running=true;gambarOp();siapRunner(k,j.langkah.map(x=>x.nama),j.judul);mulaiPoll()}
  }catch(e){toast('Server UI error: '+e.message)}
}
go('harian');initOperator();initHarian();initCetak();
if(location.hash==='#cetak'){asal='cetak';go('cetak')}
if(location.hash==='#event'&&!running){asal='event';go('event')}   // dari server_ui.py --menu cetak
</script>
